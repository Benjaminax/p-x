<!DOCTYPE html>
<html>
<head>
    <title>MRI Sample Data Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .sample-container { margin: 20px 0; border: 1px solid #ccc; padding: 15px; }
        .sample-image { width: 300px; height: 200px; background: #f0f0f0; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #666; }
        .sample-info { margin-top: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>NeuroVision MRI Sample Data</h1>
    <p>Use these sample MRI scans to test your brain diagnostic AI system.</p>

    <div id="samples"></div>

    <script>
        const samples = [
            {
                id: "sample_001",
                filename: "normal_brain_mri.jpg",
                title: "Normal Brain MRI",
                description: "Normal brain MRI scan - no abnormalities detected",
                condition: "Normal",
                confidence: 95
            },
            {
                id: "sample_002",
                filename: "brain_tumor_mri.jpg",
                title: "Brain Tumor MRI",
                description: "Brain MRI showing suspected tumor in frontal lobe",
                condition: "Tumor",
                confidence: 87
            },
            {
                id: "sample_003",
                filename: "stroke_brain_mri.jpg",
                title: "Stroke Brain MRI",
                description: "Brain MRI showing acute ischemic stroke",
                condition: "Stroke",
                confidence: 92
            },
            {
                id: "sample_004",
                filename: "alzheimers_brain_mri.jpg",
                title: "Alzheimer's Brain MRI",
                description: "Brain MRI showing signs of Alzheimer's disease",
                condition: "Alzheimer's Disease",
                confidence: 78
            },
            {
                id: "sample_005",
                filename: "multiple_sclerosis_mri.jpg",
                title: "Multiple Sclerosis MRI",
                description: "Brain MRI showing multiple sclerosis lesions",
                condition: "Multiple Sclerosis",
                confidence: 89
            }
        ];

        function renderSamples() {
            const container = document.getElementById('samples');
            samples.forEach(sample => {
                const div = document.createElement('div');
                div.className = 'sample-container';
                div.innerHTML = `
                    <div class="sample-image">
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #007bff;">MRI SCAN</div>
                            <div style="font-size: 16px; margin: 10px 0;">${sample.title}</div>
                            <div style="font-size: 14px; color: #666;">${sample.condition}</div>
                            <div style="font-size: 12px; color: #999;">Confidence: ${sample.confidence}%</div>
                        </div>
                    </div>
                    <div class="sample-info">
                        <h3>${sample.title}</h3>
                        <p><strong>Description:</strong> ${sample.description}</p>
                        <p><strong>Condition:</strong> ${sample.condition}</p>
                        <p><strong>Confidence:</strong> ${sample.confidence}%</p>
                        <button onclick="testSample('${sample.id}')">Test This Sample</button>
                        <button onclick="viewResults('${sample.id}')">View Full Results</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function testSample(sampleId) {
            const sample = samples.find(s => s.id === sampleId);
            alert(`Testing sample: ${sample.title}\\n\\nThis would normally send the image to your ML server for analysis.\\n\\nExpected result: ${sample.condition} (${sample.confidence}% confidence)`);
        }

        function viewResults(sampleId) {
            const sample = samples.find(s => s.id === sampleId);
            const results = getSampleResults(sampleId);

            let resultsText = `Full Diagnostic Results for ${sample.title}:\\n\\n`;
            resultsText += `Diagnosis: ${results.diagnosis}\\n`;
            resultsText += `Confidence: ${results.confidence}%\\n\\n`;
            resultsText += `Key Findings:\\n`;
            results.findings.forEach(finding => {
                resultsText += `• ${finding}\\n`;
            });
            resultsText += `\\nRecommendations:\\n`;
            results.recommendations.forEach(rec => {
                resultsText += `• ${rec}\\n`;
            });

            alert(resultsText);
        }

        function getSampleResults(sampleId) {
            const results = {
                "sample_001": {
                    diagnosis: "Normal brain structure",
                    confidence: 95,
                    findings: [
                        "No lesions or abnormalities detected",
                        "Normal gray matter volume",
                        "Normal white matter integrity",
                        "No signs of atrophy"
                    ],
                    recommendations: [
                        "No immediate action required",
                        "Regular check-ups recommended",
                        "Maintain healthy lifestyle"
                    ]
                },
                "sample_002": {
                    diagnosis: "Suspected meningioma in left frontal lobe",
                    confidence: 87,
                    findings: [
                        "Well-defined mass in left frontal lobe",
                        "Mass measures approximately 2.3 cm x 1.8 cm",
                        "Mild surrounding edema present",
                        "No midline shift observed"
                    ],
                    recommendations: [
                        "Urgent neurosurgery consultation required",
                        "MRI with contrast recommended for further evaluation",
                        "Consider biopsy if surgical resection planned"
                    ]
                },
                "sample_003": {
                    diagnosis: "Acute ischemic stroke in right middle cerebral artery territory",
                    confidence: 92,
                    findings: [
                        "Hyperintense signal on DWI in right MCA territory",
                        "Corresponding hypointense signal on ADC map",
                        "Involvement of right temporal and parietal lobes",
                        "No hemorrhagic transformation"
                    ],
                    recommendations: [
                        "Immediate thrombolytic therapy if within time window",
                        "Transfer to stroke center",
                        "Monitor for neurological deterioration",
                        "Start antiplatelet therapy"
                    ]
                },
                "sample_004": {
                    diagnosis: "Early-stage Alzheimer's disease with hippocampal atrophy",
                    confidence: 78,
                    findings: [
                        "Bilateral hippocampal atrophy",
                        "Enlarged temporal horns",
                        "Mild global cortical atrophy",
                        "Preserved overall brain volume"
                    ],
                    recommendations: [
                        "Neurology consultation for cognitive assessment",
                        "Consider cholinesterase inhibitors",
                        "Regular cognitive monitoring",
                        "Family counseling and support"
                    ]
                },
                "sample_005": {
                    diagnosis: "Multiple sclerosis with active demyelinating lesions",
                    confidence: 89,
                    findings: [
                        "Multiple hyperintense lesions on T2/FLAIR",
                        "Periventricular and subcortical distribution",
                        "Some lesions show gadolinium enhancement",
                        "Dawson's fingers pattern observed"
                    ],
                    recommendations: [
                        "Disease-modifying therapy initiation",
                        "Regular MRI monitoring every 6 months",
                        "Physical therapy evaluation",
                        "Vitamin D supplementation"
                    ]
                }
            };
            return results[sampleId];
        }

        // Initialize the page
        renderSamples();
    </script>
</body>
</html>
