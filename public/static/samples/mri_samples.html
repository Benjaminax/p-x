<!DOCTYPE html>
<html>
<head>
    <title>MRI Sample Data Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .sample-container { margin: 20px 0; border: 1px solid #ccc; padding: 15px; }
        .sample-image { width: 300px; height: 200px; background: #f0f0f0; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #666; }
        .sample-info { margin-top: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>NeuroVision MRI Sample Data</h1>
    <p>Use these sample MRI scans to test your brain diagnostic AI system.</p>

    <div id="samples"></div>

    <script>
        const samples = [
            {
                id: "sample_no_tumor",
                filename: "normal_brain_mri.jpg",
                title: "No Tumor — Normal Brain",
                description: "Normal brain MRI scan — no tumor detected",
                condition: "No Tumor",
                confidence: 98
            },
            {
                id: "sample_glioma",
                filename: "glioma_brain_mri.jpg",
                title: "Glioma (Representative)",
                description: "MRI showing a suspected glioma lesion",
                condition: "Glioma Tumor",
                confidence: 86
            },
            {
                id: "sample_meningioma",
                filename: "meningioma_brain_mri.jpg",
                title: "Meningioma (Representative)",
                description: "MRI demonstrating a likely meningioma",
                condition: "Meningioma Tumor",
                confidence: 84
            },
            {
                id: "sample_pituitary",
                filename: "pituitary_brain_mri.jpg",
                title: "Pituitary Tumor (Representative)",
                description: "MRI focused on the sellar region showing pituitary lesion",
                condition: "Pituitary Tumor",
                confidence: 90
            }
        ];

        function renderSamples() {
            const container = document.getElementById('samples');
            samples.forEach(sample => {
                const div = document.createElement('div');
                div.className = 'sample-container';
                div.innerHTML = `
                    <div class="sample-image">
                        <div style="text-align: center;">
                            <div style="font-size: 24px; font-weight: bold; color: #007bff;">MRI SCAN</div>
                            <div style="font-size: 16px; margin: 10px 0;">${sample.title}</div>
                            <div style="font-size: 14px; color: #666;">${sample.condition}</div>
                            <div style="font-size: 12px; color: #999;">Confidence: ${sample.confidence}%</div>
                        </div>
                    </div>
                    <div class="sample-info">
                        <h3>${sample.title}</h3>
                        <p><strong>Description:</strong> ${sample.description}</p>
                        <p><strong>Condition:</strong> ${sample.condition}</p>
                        <p><strong>Confidence:</strong> ${sample.confidence}%</p>
                        <button onclick="testSample('${sample.id}')">Test This Sample</button>
                        <button onclick="viewResults('${sample.id}')">View Full Results</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function testSample(sampleId) {
            const sample = samples.find(s => s.id === sampleId);
            alert(`Testing sample: ${sample.title}\\n\\nThis would normally send the image to your ML server for analysis.\\n\\nExpected result: ${sample.condition} (${sample.confidence}% confidence)`);
        }

        function viewResults(sampleId) {
            const sample = samples.find(s => s.id === sampleId);
            const results = getSampleResults(sampleId);

            let resultsText = `Full Diagnostic Results for ${sample.title}:\\n\\n`;
            resultsText += `Diagnosis: ${results.diagnosis}\\n`;
            resultsText += `Confidence: ${results.confidence}%\\n\\n`;
            resultsText += `Key Findings:\\n`;
            results.findings.forEach(finding => {
                resultsText += `• ${finding}\\n`;
            });
            resultsText += `\\nRecommendations:\\n`;
            results.recommendations.forEach(rec => {
                resultsText += `• ${rec}\\n`;
            });

            alert(resultsText);
        }

        function getSampleResults(sampleId) {
            const results = {
                "sample_no_tumor": {
                    diagnosis: "No Tumor",
                    confidence: 98,
                    findings: [
                        "No focal lesions detected",
                        "Normal ventricular size",
                        "No abnormal enhancement",
                        "White/gray matter within expected limits"
                    ],
                    recommendations: [
                        "Routine follow-up as clinically indicated",
                        "Maintain healthy lifestyle",
                        "No immediate intervention required"
                    ]
                },
                "sample_glioma": {
                    diagnosis: "Glioma Tumor (suspected)",
                    confidence: 86,
                    findings: [
                        "Irregular cortical mass with surrounding edema",
                        "Heterogeneous T2/FLAIR signal",
                        "Mild mass effect without midline shift",
                        "Contrast enhancement suggestive of glioma"
                    ],
                    recommendations: [
                        "Neurosurgery / neuro-oncology referral",
                        "MRI with contrast and advanced sequences",
                        "Consider biopsy or resection depending on clinical context"
                    ]
                },
                "sample_meningioma": {
                    diagnosis: "Meningioma (likely)",
                    confidence: 84,
                    findings: [
                        "Well-circumscribed extra-axial mass",
                        "Dural tail sign on contrast imaging",
                        "Local mass effect without deep invasion",
                        "Minimal surrounding edema"
                    ],
                    recommendations: [
                        "Neurosurgery referral for evaluation",
                        "Contrast MRI and surgical planning if indicated",
                        "Watchful waiting may be appropriate for small, asymptomatic lesions"
                    ]
                },
                "sample_pituitary": {
                    diagnosis: "Pituitary Tumor (suspected)",
                    confidence: 90,
                    findings: [
                        "Sellar/suprasellar mass centered on the pituitary",
                        "Possible optic chiasm effacement if large",
                        "Hormonal workup recommended",
                        "Contrast enhancement typical of pituitary lesions"
                    ],
                    recommendations: [
                        "Endocrinology and neurosurgery consultation",
                        "Visual field testing if optic apparatus involved",
                        "Hormonal evaluation and MRI with dynamic contrast"
                    ]
                }
            };
            return results[sampleId];
        }

        // Initialize the page
        renderSamples();
    </script>
</body>
</html>
